<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <!-- No gradients needed -->
  </defs>

  <!-- Base background -->

  <!-- ============================================================
       SECTION 1: Blueprint grid
  ============================================================ -->
  <g stroke="rgba(138,170,122,0.07)" stroke-width="0.4">
    <!-- Horizontal lines every 40px -->
    <line x1="0" y1="0"   x2="800" y2="0"/>
    <line x1="0" y1="40"  x2="800" y2="40"/>
    <line x1="0" y1="80"  x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <!-- Vertical lines every 40px -->
    <line x1="0"   y1="0" x2="0"   y2="400"/>
    <line x1="40"  y1="0" x2="40"  y2="400"/>
    <line x1="80"  y1="0" x2="80"  y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
    <line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
  </g>
  <!-- Tick marks every 120px at edges, length 6px -->
  <g stroke="rgba(138,170,122,0.12)" stroke-width="0.7">
    <!-- Top edge ticks -->
    <line x1="120" y1="0" x2="120" y2="6"/>
    <line x1="240" y1="0" x2="240" y2="6"/>
    <line x1="360" y1="0" x2="360" y2="6"/>
    <line x1="480" y1="0" x2="480" y2="6"/>
    <line x1="600" y1="0" x2="600" y2="6"/>
    <line x1="720" y1="0" x2="720" y2="6"/>
    <!-- Left edge ticks -->
    <line x1="0" y1="120" x2="6" y2="120"/>
    <line x1="0" y1="240" x2="6" y2="240"/>
    <line x1="0" y1="360" x2="6" y2="360"/>
  </g>

  <!-- ============================================================
       SECTION 2: Bar chart (x 40 to ~384, baseline y=340)
       16 bars: width=14, gap=8, starting x=40
       Heights: 45,52,48,60,55,70,65,80,75,90,85,100,95,115,108,125
       Bars at x: 40,62,84,106,128,150,172,194,216,238,260,282,304,326,348,370
  ============================================================ -->
  <!-- Y-axis label rules -->
  <g stroke="rgba(138,170,122,0.1)" stroke-width="0.8">
    <line x1="40" y1="290" x2="385" y2="290"/>
    <line x1="40" y1="265" x2="385" y2="265"/>
    <line x1="40" y1="240" x2="385" y2="240"/>
    <line x1="40" y1="215" x2="385" y2="215"/>
  </g>
  <!-- Baseline -->
  <line x1="40" y1="340" x2="385" y2="340" stroke="rgba(138,170,122,0.25)" stroke-width="0.8"/>
  <!-- Standard bars (heights < 100): bars 1–11 -->
  <g fill="rgba(138,170,122,0.2)">
    <rect x="40"  y="295" width="14" height="45"/>  <!-- h=45 -->
    <rect x="62"  y="288" width="14" height="52"/>  <!-- h=52 -->
    <rect x="84"  y="292" width="14" height="48"/>  <!-- h=48 -->
    <rect x="106" y="280" width="14" height="60"/>  <!-- h=60 -->
    <rect x="128" y="285" width="14" height="55"/>  <!-- h=55 -->
    <rect x="150" y="270" width="14" height="70"/>  <!-- h=70 -->
    <rect x="172" y="275" width="14" height="65"/>  <!-- h=65 -->
    <rect x="194" y="260" width="14" height="80"/>  <!-- h=80 -->
    <rect x="216" y="265" width="14" height="75"/>  <!-- h=75 -->
    <rect x="238" y="250" width="14" height="90"/>  <!-- h=90 -->
    <rect x="260" y="255" width="14" height="85"/>  <!-- h=85 -->
  </g>
  <!-- Top 4 tallest bars (heights 100,95,115,108,125 — top 4: 125,115,108,100) -->
  <!-- bars 12(h=100),13(h=95),14(h=115),15(h=108),16(h=125) -->
  <!-- applying brighter fill to bars with h >= 100: bars 12,14,15,16 -->
  <g fill="rgba(138,170,122,0.32)">
    <rect x="282" y="240" width="14" height="100"/> <!-- h=100 -->
    <rect x="304" y="245" width="14" height="95"/>  <!-- h=95  -->
    <rect x="326" y="225" width="14" height="115"/> <!-- h=115 -->
    <rect x="348" y="232" width="14" height="108"/> <!-- h=108 -->
    <rect x="370" y="215" width="14" height="125"/> <!-- h=125 -->
  </g>

  <!-- ============================================================
       SECTION 3: Line graph overlaid on bar chart
       10 points, x: 47→375 evenly, y values given
  ============================================================ -->
  <polyline
    points="47,330 84,318 121,322 158,305 195,308 232,292 269,285 306,272 343,268 375,255"
    stroke="#A9C89A" stroke-width="1.4" fill="none" opacity="0.6" stroke-linejoin="round"/>
  <g fill="#A9C89A" opacity="0.7">
    <circle cx="47"  cy="330" r="3"/>
    <circle cx="84"  cy="318" r="3"/>
    <circle cx="121" cy="322" r="3"/>
    <circle cx="158" cy="305" r="3"/>
    <circle cx="195" cy="308" r="3"/>
    <circle cx="232" cy="292" r="3"/>
    <circle cx="269" cy="285" r="3"/>
    <circle cx="306" cy="272" r="3"/>
    <circle cx="343" cy="268" r="3"/>
    <circle cx="375" cy="255" r="3"/>
  </g>

  <!-- ============================================================
       SECTION 5: Vertical divider
  ============================================================ -->
  <line x1="420" y1="40" x2="420" y2="360" stroke="rgba(138,170,122,0.12)" stroke-width="0.6"/>

  <!-- ============================================================
       SECTION 4: Radar diagram centered at (600, 210)
  ============================================================ -->
  <!-- 5 concentric circles -->
  <g stroke="rgba(138,170,122,0.15)" stroke-width="0.7" fill="none">
    <circle cx="600" cy="210" r="28"/>
    <circle cx="600" cy="210" r="52"/>
    <circle cx="600" cy="210" r="76"/>
    <circle cx="600" cy="210" r="100"/>
    <circle cx="600" cy="210" r="124"/>
  </g>
  <!-- 8 spokes at 45° intervals (0=north, clockwise) -->
  <g stroke="rgba(138,170,122,0.12)" stroke-width="0.6">
    <!-- 0° north -->
    <line x1="600" y1="210" x2="600" y2="86"/>
    <!-- 45° NE: sin45=cos45≈0.7071, 124*0.7071≈87.7 -->
    <line x1="600" y1="210" x2="687.7" y2="122.3"/>
    <!-- 90° east -->
    <line x1="600" y1="210" x2="724" y2="210"/>
    <!-- 135° SE -->
    <line x1="600" y1="210" x2="687.7" y2="297.7"/>
    <!-- 180° south -->
    <line x1="600" y1="210" x2="600" y2="334"/>
    <!-- 225° SW -->
    <line x1="600" y1="210" x2="512.3" y2="297.7"/>
    <!-- 270° west -->
    <line x1="600" y1="210" x2="476" y2="210"/>
    <!-- 315° NW -->
    <line x1="600" y1="210" x2="512.3" y2="122.3"/>
  </g>
  <!-- Polygon on 4th circle (r=100) at 0,60,120,180,240,300° from north
       0°:  (600, 110)
       60°: (600+86.6, 210-50) = (686.6, 160)
       120°:(600+86.6, 210+50) = (686.6, 260)
       180°:(600, 310)
       240°:(600-86.6, 210+50) = (513.4, 260)
       300°:(600-86.6, 210-50) = (513.4, 160)
  -->
  <polygon
    points="600,110 686.6,160 686.6,260 600,310 513.4,260 513.4,160"
    fill="rgba(138,170,122,0.08)" stroke="#A9C89A" stroke-width="0.8" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="600" cy="210" r="4" fill="#6F965E" opacity="0.6"/>
</svg>
