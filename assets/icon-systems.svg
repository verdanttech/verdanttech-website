<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Orbital ring as four separate arcs, one per dot.
         Each dot sits between its incoming arc (connected left) and a gap (disconnected right).
         Dots at top(270deg), right(0deg), bottom(90deg), left(180deg).
         Gap after each dot = 12 degrees. Arc spans from gap-end of previous dot to this dot position. -->

    <!-- Arc 1: from 12deg to 270deg (top dot) — 258 degrees clockwise -->
    <path d="M 2.44,17.84 A 20,20 0 0,1 22.0,2.0" stroke="#416843" stroke-width="1.0" fill="none"/>
    <!-- Top dot at 270deg (-90deg): (22, 2) — connected on left, gap on right -->
    <circle cx="22" cy="2" r="1.5" fill="#416843" stroke="none"/>

    <!-- Arc 2: from 282deg to 0deg (right dot) — 78 degrees clockwise -->
    <path d="M 26.25,2.71 A 20,20 0 0,1 42.0,22.0" stroke="#416843" stroke-width="1.0" fill="none"/>
    <!-- Right dot at 0deg: (42, 22) -->
    <circle cx="42" cy="22" r="1.5" fill="#416843" stroke="none"/>

    <!-- Arc 3: from 12deg to 90deg (bottom dot) — 78 degrees clockwise -->
    <path d="M 41.63,25.42 A 20,20 0 0,1 22.0,42.0" stroke="#416843" stroke-width="1.0" fill="none"/>
    <!-- Bottom dot at 90deg: (22, 42) -->
    <circle cx="22" cy="42" r="1.5" fill="#416843" stroke="none"/>

    <!-- Arc 4: from 102deg to 180deg (left dot) — 78 degrees clockwise -->
    <path d="M 17.84,41.56 A 20,20 0 0,1 2.0,22.0" stroke="#416843" stroke-width="1.0" fill="none"/>
    <!-- Left dot at 180deg: (2, 22) -->
    <circle cx="2" cy="22" r="1.5" fill="#416843" stroke="none"/>
    <!-- Gap from 192deg back to 12deg closes the ring (not drawn) -->

    <!-- Gear A: center (15,16), enlarged, valley=5.5, tip=7.8, 6 teeth, start=-90deg -->
    <g transform="translate(13.1,16.9) scale(1.090) translate(-15,-16)">
    <path d="M 13.78,10.63 L 14.22,8.32 L 15.78,8.32 L 16.22,10.63 L 18.59,11.97 L 20.72,11.28 L 21.45,12.52 L 19.66,14.09 L 19.66,17.91 L 21.45,19.48 L 20.72,20.72 L 18.59,20.03 L 16.22,21.37 L 15.78,23.68 L 14.22,23.68 L 13.78,21.37 L 11.41,20.03 L 9.28,20.72 L 8.55,19.48 L 10.34,17.91 L 10.34,14.09 L 8.55,12.52 L 9.28,11.28 L 11.41,11.97 Z" stroke="#416843" stroke-width="1.3" fill="none"/>
    <circle cx="15" cy="16" r="2.2" stroke="#416843" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Gear B: center (29,16), valley=5.5, tip=7.8, 6 teeth, start=-60deg -->
    <g transform="translate(30.9,16.9) scale(1.090) translate(-29,-16)">
    <path d="M 30.52,10.67 L 32.06,9.06 L 33.3,9.78 L 32.61,11.91 L 33.95,14.28 L 36.26,14.72 L 36.26,16.28 L 33.95,16.72 L 32.61,19.09 L 33.3,21.22 L 32.06,21.94 L 30.52,20.33 L 27.48,20.33 L 25.94,21.94 L 24.7,21.22 L 25.39,19.09 L 24.05,16.72 L 21.74,16.28 L 21.74,14.72 L 24.05,14.28 L 25.39,11.91 L 24.7,9.78 L 25.94,9.06 L 27.48,10.67 Z" stroke="#416843" stroke-width="1.3" fill="none"/>
    <circle cx="29" cy="16" r="2.2" stroke="#416843" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Gear C: center (22,29), valley=5.5, tip=7.8, 6 teeth, start=-75deg -->
    <g transform="translate(22.0,32.2) scale(1.090) translate(-22,-28)">
    <path d="M 22.09,23.2 L 23.08,21.27 L 24.53,21.67 L 24.38,23.97 L 26.27,25.86 L 28.57,25.71 L 28.97,27.16 L 27.04,28.15 L 26.38,30.62 L 27.55,32.52 L 26.56,33.51 L 24.66,32.34 L 21.91,33.02 L 20.92,34.95 L 19.47,34.55 L 19.62,32.25 L 17.73,30.36 L 15.43,30.51 L 15.03,29.06 L 16.96,28.07 L 17.62,25.6 L 16.45,23.7 L 17.44,22.71 L 19.34,23.88 Z" stroke="#416843" stroke-width="1.3" fill="none"/>
    <circle cx="22" cy="28" r="2.2" stroke="#416843" stroke-width="1.2" fill="none"/>
    </g>

  </g>
</svg>
