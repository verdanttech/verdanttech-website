    <!-- Arrow 2: left of box2 → right angle → top of box3 -->
    <path d="M 27,22.5 L 14.5,22.5 L 14.5,24.5" stroke="#416843" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
