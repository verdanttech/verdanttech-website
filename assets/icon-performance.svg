<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <circle cx="22" cy="22" r="20" stroke="#416843" stroke-width="1.4" opacity="1" fill="none"/>

  <!-- 8-tooth gear, center (22,22), valley_r=11, tip_r=14
       tooth_angle[i] = -90 + i*45 deg
       3 pts/tooth × 8 = 24 pts (shared valleys)
       tip_L at tooth_angle-10°, tip_R at tooth_angle+10°, valley at tooth_angle+22.5° -->
  <path d="
    M 17.79,11.84
    L 19.57,8.21  L 24.43,8.21  L 26.21,11.84
    L 30.03,10.53 L 33.47,13.97 L 32.16,17.79
    L 35.79,19.57 L 35.79,24.43 L 32.16,26.21
    L 33.47,30.03 L 30.03,33.47 L 26.21,32.16
    L 24.43,35.79 L 19.57,35.79 L 17.79,32.16
    L 13.97,33.47 L 10.53,30.03 L 11.84,26.21
    L 8.21,24.43  L 8.21,19.57  L 11.84,17.79
    L 10.53,13.97 L 13.97,10.53
    Z"
    stroke="#416843" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hub -->
  <circle cx="22" cy="22" r="4.5" stroke="#416843" stroke-width="1.4" fill="none"/>

  <polyline points="9.1,32.9 24.0,21 28.0,20 33.1,11.2" stroke="#416843" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="34.4,9.0 35.1,12.4 31.1,10.0" fill="#416843" stroke="none"/>
</svg>
